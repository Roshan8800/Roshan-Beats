plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

import java.util.Properties

val secretsFile = project.rootProject.file("secrets.properties")
val secrets = Properties()
if (secretsFile.exists()) {
    secrets.load(secretsFile.inputStream())
}


android {
    namespace 'com.roshan.music'
    compileSdk 34

    defaultConfig {
        applicationId "com.roshan.music"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField "String", "GEMINI_API_KEY", secrets.getProperty("GEMINI_API_KEY", "")
        buildConfigField "String", "DEEPSEEK_V3_1_API_KEY", secrets.getProperty("DEEPSEEK_V3_1_API_KEY", "")
        buildConfigField "String", "DEEPSEEK_R1_0528_API_KEY", secrets.getProperty("DEEPSEEK_R1_0528_API_KEY", "")
        buildConfigField "String", "DEEPSEEK_R1_0528_QWEN3_8B_API_KEY", secrets.getProperty("DEEPSEEK_R1_0528_QWEN3_8B_API_KEY", "")
        buildConfigField "String", "DEEPSEEK_V3_0324_API_KEY", secrets.getProperty("DEEPSEEK_V3_0324_API_KEY", "")
        buildConfigField "String", "R1_DISTILL_LLAMA_70B_API_KEY", secrets.getProperty("R1_DISTILL_LLAMA_70B_API_KEY", "")
        buildConfigField "String", "JAMENDO_CLIENT_ID", secrets.getProperty("JAMENDO_CLIENT_ID", "")
        buildConfigField "String", "JAMENDO_CLIENT_SECRET", secrets.getProperty("JAMENDO_CLIENT_SECRET", "")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2"
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material:1.6.1'
    implementation "androidx.compose.material:material-icons-extended:1.6.1"

    // Navigation
    implementation "androidx.navigation:navigation-compose:2.7.6"

    // Accompanist Pager
    implementation "com.google.accompanist:accompanist-pager:0.28.0"
    implementation "com.google.accompanist:accompanist-pager-indicators:0.28.0"

    // Retrofit for networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Coil for image loading
    implementation "io.coil-kt:coil-compose:2.5.0"

    // ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.2.0'
    implementation 'androidx.media3:media3-ui:1.2.0'
    implementation 'androidx.media3:media3-session:1.2.0'

    // Room
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    // To use Kotlin Symbol Processing (KSP)
    ksp "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.1"
    testImplementation "androidx.test:core-ktx:1.5.0"
    testImplementation "androidx.test.ext:junit-ktx:1.1.5"
    testImplementation "org.robolectric:robolectric:4.10.3"
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
